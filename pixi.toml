# Merges practicals 0,1,2,3,4,5,8,9 of ELIXIR-SCO-spatial-omics-2026 (practicals 6 and 7 excluded). Tested 2026-11-09/10, pixi 0.82.0, linux-64:
# notebooks of p0,1,2,3,4,5,8,9 execute without errors (p9 with its dataset fetched over HTTPS, as `lamin load` could not reach the lamin DB). Results match the course envs for p1,5,9 (p0 cosmetic); clustering differs for p2,4 and BANKSY in p8; p3 varies between runs even in its course env.
# Upper bounds that `pixi add` wrote automatically were dropped. Only real pins are kept, each with its reason.
[workspace]
name = "elixir-spatial-all"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]
version = "0.1.0"

[dependencies]
python = "3.12.*"                   # p8/p9 pin 3.12; squidpy 1.8.3 needs >=3.12; cellcharter/pybanksy need <3.14
anndata = "0.13.2.*"                # lamindb-core 2.10.0: anndata<=0.13.2; liana main needs >=0.13
fsspec = "<=2026.1.0"               # lamindb 2.10.0 -> s3fs<=2026.1.0 (comment in p9 pixi.toml)
scanpy = ">=1.12.4,<1.13"           # interscale/squidpy break on scanpy>=1.13 (interscale pyproject)
spatialdata = ">=0.8.0,<0.9"
spatialdata-plot = ">=0.4.2,<0.5"
geopandas = "<1.2"                  # geopandas 1.2 carries .attrs into new GeoDataFrames, so spatialdata-plot 0.4.2 render_shapes loses its "global" transform (KeyError in p0, p4); p4 lock used 1.1.4
polars = "<2"                       # sainsc 0.3.1 read_Xenium passes n_threads to polars.read_csv, which polars 2.0 rejects (p3); p3 lock used 1.42.0
zarr = ">=3"
pandas = ">=2.3.3,<3"                # pybanksy 1.3.5 (p8) and tangram map_cells (p5) index Series by position, which pandas 3 treats as labels
numpy = ">=2.4.6,<3"
scipy = "*"
scikit-learn = "*"
scikit-misc = "*"
statsmodels = "*"
numba = "*"
matplotlib = "*"
seaborn = "*"
plotly = "*"
plotnine = "*"
pillow = "*"
pyarrow = "*"
tqdm = "*"
igraph = "*"
leidenalg = ">=0.12,<0.13"
sainsc = ">=0.3.1,<0.4"
cellpose = "==3.1.0"
imagecodecs = "<2026"             # squidpy 1.8.3 (PyPI) requires imagecodecs>=2025.8.2,<2026
scvi-tools = "==1.5.0.post1"         # matches p8 course lock
pyro-ppl = "==1.9.1"                # cell2location 0.1.5 imports pyro deep_getattr, removed in pyro 1.9.2 (p5 lock uses 1.9.1)
pytorch = { version = "==2.10.0", build = "cpu_generic*" }   # matches p8 course lock; p8 GMM spatial domains differ with 2.13 cpu_mkl
pytorch_cluster = "*"
pytorch_scatter = "*"
pytorch_sparse = "*"
pytorch_geometric = ">=2"
pytorch-lightning = ">=2"
lightning = ">=2"
torchmetrics = ">=1.8"
huggingface_hub = ">=0.34"
jupyterlab = "*"
jupyter = "*"
ipykernel = "*"
pixi-kernel = "*"
nbconvert = "*"
pip = "*"
curl = "*"
tar = "*"
gzip = "*"

[pypi-dependencies]
spatialdata-io = ">=0.7.1,<0.8"     # from PyPI, matching p4's env (conda-forge only has 0.7.0)
squidpy = "==1.8.3"
liana = { git = "https://github.com/scverse/liana-py", rev = "08590dbd4" }
lamindb = "==2.10.0"
decoupler = "==2.2.0"
interscale = { git = "https://github.com/theislab/interscale", rev = "c98a307e4fa3" }
cellcharter = ">=0.3.7,<0.4"
pybanksy = ">=1.3.5,<2"
tangram-sc = ">=1.0.4,<2"
cell2location = ">=0.1.5,<0.2"
celltypist = "*"
abc-atlas-access = { git = "https://github.com/alleninstitute/abc_atlas_access.git", extras = ["notebooks"] }
