name: Code linting

on:
  push:
  pull_request:
    branches: [main]
    paths:
       - 'practicals/**/*.py'
       - 'practicals/**/*.ipynb'

permissions:
  contents: read

jobs:
  lint-python:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get changed Python and notebook files
        id: changed-py
        uses: tj-actions/changed-files@v46
        with:
          files: |
            practicals/**/*.py
            practicals/**/*.ipynb

      - name: Set up Python
        if: steps.changed-py.outputs.any_changed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ruff
        if: steps.changed-py.outputs.any_changed == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff on changed files
        if: steps.changed-py.outputs.any_changed == 'true'
        run: |
          ruff check ${{ steps.changed-py.outputs.all_changed_files }}
